services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 stockapi.wsgi:application"
    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env      
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: on-failure

volumes:
  postgres_data: